<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Configurações</h1>

<label>Volume Música</label>
<input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.5">

<label>Volume Efeitos</label>
<input type="range" id="sfxVolume" min="0" max="1" step="0.05" value="0.5">

<br><br>
<button onclick="window.location='index.html'">Voltar</button>

<script>
const bgMusic = new Audio('musica_fundo.mp3');
bgMusic.loop = true;
bgMusic.play();

const musicVolume = document.getElementById('musicVolume');
musicVolume.addEventListener('input', () => {
  bgMusic.volume = musicVolume.value;
});
</script>

</body>
</html>
